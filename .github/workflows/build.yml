# Builds the iPhone app on a Mac at GitHub (free for public repositories) and puts
# CadshapeMaal.ipa on the release «latest». The app is not signed here: Sideloadly or
# SideStore signs it on your computer/phone with your own Apple ID.
name: Bygg iPhone-appen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Test the measuring maths (HoleKit)
        run: swift test --package-path HoleKit

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project CadshapeMaal.xcodeproj \
            -scheme CadshapeMaal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*(deprecated|never|unused)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/CadshapeMaal.app || { tail -n 200 build.log; exit 1; }

      - name: Pack the IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CadshapeMaal.app Payload/
          zip -qry CadshapeMaal.ipa Payload
          ls -la CadshapeMaal.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CadshapeMaal-ipa
          path: CadshapeMaal.ipa

      - name: Publish on the release «latest»
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CadshapeMaal.ipa \
            --target "$GITHUB_SHA" \
            --title "CadSHAPE Mål – siste bygg" \
            --notes "Usignert IPA bygd fra $GITHUB_SHA. Installer med Sideloadly eller SideStore (se README)."
